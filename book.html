<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<title>Book now · Gulaab Beauty Lounge</title>
<meta name="description" content="Book a salon appointment at Gulaab Beauty Lounge in three steps: choose a service, a stylist and a time.">
<script type="module" src="/src/main.js"></script>
</head>
<body data-barba="wrapper">
<!-- @include header -->
<main id="main" data-barba="container" data-barba-namespace="book">

  <section class="page-head" aria-labelledby="bk-title">
    <div class="container">
      <p class="eyebrow">Book now</p>
      <h1 id="bk-title" class="display" data-rise>Three choices,<br><em>one rose in full bloom.</em></h1>
      <p class="lead">Each step opens a ring of petals: the service, then your stylist, then the time.</p>
    </div>
  </section>

  <section aria-label="Booking">
    <div class="container book">
      <div class="book-rose" data-rose-stage>
        <canvas data-rose aria-hidden="true"></canvas>
        <div class="rose-svg" data-rose-svg></div>
        <ol class="rings" aria-hidden="true" data-rings><li>Service</li><li>Stylist</li><li>Time</li></ol>
        <div class="summary" data-summary aria-live="polite"></div>
      </div>

      <div>
        <form class="steps" data-book novalidate>
          <div class="step is-active" data-step="0">
            <button type="button" class="step-head" data-open-step="0" aria-expanded="true"><span class="step-num">1</span><span class="step-title">Choose a service<small data-pick="0">What would you like done?</small></span><span class="step-edit" aria-hidden="true"></span></button>
            <div class="step-body">
              <div class="svc-cats" role="group" aria-label="Category" data-svc-cats></div>
              <div class="svc-list" role="radiogroup" aria-label="Service" data-svc-list></div>
            </div>
          </div>
          <div class="step" data-step="1">
            <button type="button" class="step-head" data-open-step="1" aria-expanded="false" disabled><span class="step-num">2</span><span class="step-title">Choose your stylist<small data-pick="1">Or the first one free</small></span><span class="step-edit" aria-hidden="true"></span></button>
            <div class="step-body"><div class="sty-list" role="radiogroup" aria-label="Stylist" data-sty-list></div></div>
          </div>
          <div class="step" data-step="2">
            <button type="button" class="step-head" data-open-step="2" aria-expanded="false" disabled><span class="step-num">3</span><span class="step-title">Pick a time<small data-pick="2">We're open Tuesday to Sunday</small></span><span class="step-edit" aria-hidden="true"></span></button>
            <div class="step-body">
              <div class="dates" role="group" aria-label="Day" data-dates></div>
              <div class="slots" role="group" aria-label="Time" data-slots></div>
              <div class="contact-fields" data-contact hidden>
                <div class="field"><label for="b-name">Your name</label><input id="b-name" name="name" autocomplete="name" required><p class="field-error" id="e-name"></p></div>
                <div class="field"><label for="b-phone">Mobile</label><input id="b-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="03xx xxxxxxx" required><p class="field-error" id="e-phone"></p></div>
              </div>
              <button type="submit" class="btn btn-rose" data-confirm hidden>Confirm booking <svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
            </div>
          </div>
        </form>
        <div class="confirm" data-done hidden tabindex="-1"></div>
      </div>
    </div>
  </section>

</main>
<!-- @include footer -->
</body>
</html>

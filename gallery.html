<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<title>Lookbook · Gulaab Beauty Lounge</title>
<meta name="description" content="The Gulaab lookbook: bridal looks, hair, nails, skin and mehndi from our DHA lounge.">
<script type="module" src="/src/main.js"></script>
</head>
<body data-barba="wrapper">
<!-- @include header -->
<main id="main" data-barba="container" data-barba-namespace="gallery">

  <section class="look on-dark" data-dark aria-labelledby="lk-title">
    <div class="look-stage" data-look-stage><canvas data-look aria-hidden="true"></canvas></div>
    <div class="container look-head">
      <p class="eyebrow">Lookbook</p>
      <h1 id="lk-title" class="display look-title" data-rise>Around<br>the <em>rose.</em></h1>
      <p class="look-hint">Drag to turn. Click a look to bring it forward, and again to open it.</p>
    </div>
    <div class="look-now" aria-live="polite" data-look-now></div>
    <div class="look-controls">
      <div class="seg" role="group" aria-label="Arrangement">
        <button type="button" data-layout="ring" aria-pressed="true"><svg aria-hidden="true"><use href="#i-ring"/></svg><span>Ring</span></button>
        <button type="button" data-layout="spiral" aria-pressed="false"><svg aria-hidden="true"><use href="#i-spiral"/></svg><span>Spiral</span></button>
      </div>
      <div class="look-nav">
        <button type="button" class="icon-btn" data-prev aria-label="Previous look"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
        <span class="look-count"><b data-look-i>1</b> / <span data-look-n></span></span>
        <button type="button" class="icon-btn" data-next aria-label="Next look"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
  </section>

  <section class="look-carousel" aria-label="Lookbook">
    <div class="container">
      <div class="carousel" data-carousel></div>
    </div>
  </section>

  <section class="section-tight" aria-labelledby="lk-grid-title">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">Every look</p>
          <h2 id="lk-grid-title" class="display" data-rise>The <em>whole album</em></h2>
        </div>
        <a class="btn btn-rose" href="/book">Book your look <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </div>
      <div class="album" data-album></div>
    </div>
  </section>

  <div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true" aria-label="Look">
    <button type="button" class="icon-btn lb-close" data-lb-close aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    <figure><img alt="" data-lb-img src="/img/p/1684868268327-7e5590bcfbd6-1280.webp"><figcaption data-lb-cap></figcaption></figure>
  </div>

</main>
<!-- @include footer -->
</body>
</html>
